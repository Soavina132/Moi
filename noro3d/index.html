<!DOCTYPE html>
<html lang="mg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1b14">
<title>Sauver la Fille du Maire 3D — Madagascar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a1410;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;user-select:none}
  #c{display:block;width:100%;height:100%;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.38) 100%);
    mix-blend-mode:multiply}
  #grain{position:fixed;inset:0;pointer-events:none;opacity:.045;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
  .hud{position:fixed;top:0;left:0;right:0;padding:14px 16px;display:flex;
    justify-content:space-between;align-items:flex-start;pointer-events:none;
    text-shadow:0 2px 10px rgba(0,0,0,.85);font-size:13px;font-weight:700;
    letter-spacing:.3px}
  .hud .right{text-align:right}
  #hearts{font-size:19px;letter-spacing:2px;margin-top:3px}
  #distBar{width:130px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);
    margin-top:7px;overflow:hidden;margin-left:auto}
  #distFill{height:100%;width:0%;background:linear-gradient(90deg,#4ade80,#a3e635);
    transition:width .18s}
  #speed{font-size:11px;font-weight:600;color:#a7f3c0;margin-top:5px}
  .ctrl{position:fixed;bottom:0;left:0;right:0;padding:16px 18px calc(20px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
  .btn{pointer-events:auto;width:78px;height:78px;border-radius:26px;
    background:rgba(12,26,20,.42);border:2px solid rgba(255,255,255,.5);
    display:flex;align-items:center;justify-content:center;font-size:25px;
    color:#fff;backdrop-filter:blur(10px);box-shadow:0 8px 22px rgba(0,0,0,.35);
    transition:transform .07s,background .12s,border-color .12s}
  .btn:active,.btn.on{transform:scale(.92);background:rgba(74,222,128,.55);
    border-color:#4ade80}
  .grp{display:flex;gap:12px}
  #jump{width:92px;height:92px;font-size:28px;border-radius:50%}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:26px 22px;background:linear-gradient(165deg,rgba(5,17,12,.97),rgba(2,7,5,.99));
    z-index:10;overflow:auto}
  .overlay.hide{display:none}
  .ov-top{font-size:11px;letter-spacing:3.5px;color:#4ade80;text-transform:uppercase;
    margin-bottom:12px;font-weight:800}
  .ov-title{font-size:25px;font-weight:800;line-height:1.22;margin-bottom:12px;letter-spacing:-.3px}
  .ov-text{font-size:14.5px;line-height:1.62;color:#c3d3ca;margin-bottom:20px;max-width:520px}
  .ov-text em{color:#4ade80;font-style:normal;font-weight:700}
  .ov-btn{align-self:flex-start;padding:14px 28px;border-radius:999px;
    background:linear-gradient(135deg,#4ade80,#22c55e);color:#04160f;font-weight:800;
    font-size:15px;border:none;box-shadow:0 10px 24px rgba(34,197,94,.35)}
  .ov-btn:active{transform:scale(.97)}
  .ov-step{margin-top:16px;font-size:11.5px;color:#5d7568;letter-spacing:1px}
  #hint{position:fixed;bottom:112px;left:0;right:0;text-align:center;font-size:12px;
    color:rgba(255,255,255,.72);pointer-events:none;text-shadow:0 2px 8px #000;
    letter-spacing:.3px}
  #flash{position:fixed;inset:0;background:#ff3b30;opacity:0;pointer-events:none;
    transition:opacity .22s}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a1410;z-index:20;font-size:14px;color:#4ade80;letter-spacing:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="grain"></div>

<div class="hud">
  <div>
    <div id="lvlName">Niveau 1</div>
    <div id="hearts">❤❤❤</div>
  </div>
  <div class="right">
    <div id="score">0 Ar</div>
    <div id="distTxt">0 m</div>
    <div id="distBar"><div id="distFill"></div></div>
    <div id="speed">0 km/h</div>
  </div>
</div>

<div id="hint">◀ ▶ changer de voie · ▲ sauter</div>

<div class="ctrl">
  <div class="grp">
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
  </div>
  <div class="btn" id="jump">▲</div>
</div>

<div id="flash"></div>
<div id="loading">MANDEFA…</div>

<div class="overlay hide" id="intro">
  <div class="ov-top" id="ovTop">Sauver la Fille du Maire 3D</div>
  <div class="ov-title" id="ovTitle"></div>
  <div class="ov-text" id="ovText"></div>
  <button class="ov-btn" id="ovBtn">Hanomboka ▶</button>
  <div class="ov-step" id="ovStep"></div>
</div>

<script src="lib/three.min.js"></script>
<script>
// ============ RENDU ============
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if ("outputColorSpace" in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.1, 600);
camera.position.set(0, 4.4, 9.2);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- lumières ----------
const sun = new THREE.DirectionalLight(0xfff2d8, 3.1);
sun.position.set(-22, 34, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -32;
sun.shadow.camera.right = 32;
sun.shadow.camera.top = 34;
sun.shadow.camera.bottom = -22;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const hemi = new THREE.HemisphereLight(0xdcefff, 0x7a8a55, 1.25);
scene.add(hemi);
const fill = new THREE.DirectionalLight(0xbcd6ff, 0.35);
fill.position.set(14, 10, -12);
scene.add(fill);

// ---------- textures procédurales ----------
function canvasTex(size, draw, repeatX = 1, repeatY = 1) {
  const cv = document.createElement("canvas");
  cv.width = cv.height = size;
  const c = cv.getContext("2d");
  draw(c, size);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = 4;
  if ("colorSpace" in t) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function noise(c, size, amount, alpha) {
  for (let i = 0; i < amount; i++) {
    const v = Math.random() * 255 | 0;
    c.fillStyle = `rgba(${v},${v},${v},${alpha})`;
    c.fillRect(Math.random() * size, Math.random() * size, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
}

const TEX = {
  dirt: canvasTex(256, (c, s) => {
    c.fillStyle = "#8f6f4a"; c.fillRect(0, 0, s, s);
    for (let i = 0; i < 900; i++) {
      const r = Math.random();
      c.fillStyle = r < 0.4 ? "rgba(120,90,60,.5)" : r < 0.7 ? "rgba(160,130,90,.45)" : "rgba(90,70,45,.4)";
      c.beginPath();
      c.arc(Math.random() * s, Math.random() * s, 1 + Math.random() * 4, 0, 7);
      c.fill();
    }
    noise(c, s, 1400, 0.06);
  }, 26, 90),

  grass: canvasTex(256, (c, s) => {
    c.fillStyle = "#5c8a3a"; c.fillRect(0, 0, s, s);
    for (let i = 0; i < 1400; i++) {
      c.strokeStyle = Math.random() < 0.5 ? "rgba(70,110,45,.55)" : "rgba(130,170,80,.5)";
      c.lineWidth = 1;
      const x = Math.random() * s, y = Math.random() * s;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + (Math.random() - 0.5) * 3, y - 3 - Math.random() * 5); c.stroke();
    }
  }, 22, 80),

  asphalt: canvasTex(256, (c, s) => {
    c.fillStyle = "#43454c"; c.fillRect(0, 0, s, s);
    noise(c, s, 3000, 0.09);
    for (let i = 0; i < 24; i++) {
      c.strokeStyle = "rgba(30,30,34,.4)"; c.lineWidth = 1;
      c.beginPath();
      let x = Math.random() * s, y = Math.random() * s;
      c.moveTo(x, y);
      for (let k = 0; k < 4; k++) { x += (Math.random() - 0.5) * 26; y += (Math.random() - 0.5) * 26; c.lineTo(x, y); }
      c.stroke();
    }
  }, 3, 60),

  water: canvasTex(256, (c, s) => {
    c.fillStyle = "#1f6f9c"; c.fillRect(0, 0, s, s);
    for (let i = 0; i < 260; i++) {
      c.strokeStyle = `rgba(255,255,255,${0.04 + Math.random() * 0.12})`;
      c.lineWidth = 1 + Math.random() * 2;
      const y = Math.random() * s;
      c.beginPath();
      c.moveTo(0, y);
      for (let x = 0; x <= s; x += 16) c.lineTo(x, y + Math.sin(x / 22 + i) * 3);
      c.stroke();
    }
  }, 8, 26),

  wood: canvasTex(128, (c, s) => {
    c.fillStyle = "#a87a4c"; c.fillRect(0, 0, s, s);
    for (let i = 0; i < 60; i++) {
      c.strokeStyle = `rgba(110,75,40,${0.15 + Math.random() * 0.3})`;
      c.lineWidth = 0.6 + Math.random() * 1.6;
      const x = Math.random() * s;
      c.beginPath(); c.moveTo(x, 0);
      for (let y = 0; y <= s; y += 8) c.lineTo(x + Math.sin(y / 14 + i) * 2, y);
      c.stroke();
    }
  }, 1, 1),

  thatch: canvasTex(128, (c, s) => {
    c.fillStyle = "#b98a4a"; c.fillRect(0, 0, s, s);
    for (let i = 0; i < 700; i++) {
      c.strokeStyle = Math.random() < 0.5 ? "rgba(120,85,40,.55)" : "rgba(210,170,100,.5)";
      c.lineWidth = 1;
      const x = Math.random() * s, y = Math.random() * s;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + (Math.random() - 0.5) * 4, y + 6); c.stroke();
    }
  }, 2, 2),
};

// ---------- ciel ----------
const skyGeo = new THREE.SphereGeometry(300, 24, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    top: { value: new THREE.Color(0x2f6ea8) },
    bottom: { value: new THREE.Color(0xdff0f8) },
    sunDir: { value: new THREE.Vector3(-0.5, 0.55, 0.4).normalize() },
    sunColor: { value: new THREE.Color(0xfff0c8) },
  },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform vec3 top; uniform vec3 bottom; uniform vec3 sunDir; uniform vec3 sunColor;
    varying vec3 vDir;
    void main(){
      float h = clamp(vDir.y * 1.25 + 0.12, 0.0, 1.0);
      vec3 col = mix(bottom, top, pow(h, 0.85));
      float d = max(dot(normalize(vDir), normalize(sunDir)), 0.0);
      col += sunColor * pow(d, 260.0) * 2.2;
      col += sunColor * pow(d, 12.0) * 0.16;
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const sky = new THREE.Mesh(skyGeo, skyMat);
sky.frustumCulled = false;
scene.add(sky);

// ---------- matériaux ----------
const M = {};
function stdMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0.02, ...opts });
}
function texturedMat(tex, color, opts = {}) {
  return new THREE.MeshStandardMaterial({ map: tex, color, roughness: 0.9, metalness: 0.02, ...opts });
}

// primitives avec ombres
function box(w, h, d, material, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function capsule(r, h, material, x = 0, y = 0, z = 0) {
  const geo = new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(r, h, 4, 10)
    : new THREE.CylinderGeometry(r, r, h + r * 2, 10);
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function sphere(r, material, x = 0, y = 0, z = 0, seg = 16) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, seg), material);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function cyl(rt, rb, h, material, seg = 12) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), material);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
// ============ PERSONNAGES DÉTAILLÉS ============
const SKIN = stdMat(0x8d5a35, { roughness: 0.72 });
const SKIN_L = stdMat(0xb07a4e, { roughness: 0.72 });

function makeHuman(cfg) {
  // cfg: skin, shirt, pants, hair, hairLong, dress, cap, uniform
  const g = new THREE.Group();
  const skin = cfg.skin || SKIN;
  const shirtM = stdMat(cfg.shirt);
  const pantsM = stdMat(cfg.pants);

  // jambes (hanche -> genou -> pied)
  const legs = [];
  [-0.16, 0.16].forEach((dx) => {
    const hip = new THREE.Group();
    hip.position.set(dx, 0.86, 0);
    const thigh = capsule(0.105, 0.42, pantsM, 0, -0.21, 0);
    hip.add(thigh);
    const knee = new THREE.Group();
    knee.position.set(0, -0.44, 0);
    const shin = capsule(0.09, 0.4, cfg.bareLegs ? skin : pantsM, 0, -0.2, 0);
    knee.add(shin);
    const shoe = box(0.17, 0.1, 0.3, stdMat(cfg.shoe || 0x2b2b2b), 0, -0.42, 0.05);
    knee.add(shoe);
    hip.add(knee);
    g.add(hip);
    legs.push({ hip, knee });
  });

  // torse
  const torso = new THREE.Group();
  torso.position.y = 0.9;
  const chest = capsule(0.19, 0.36, shirtM, 0, 0.2, 0);
  chest.scale.set(1, 1, 0.72);
  torso.add(chest);
  if (cfg.dress) {
    const skirt = cyl(0.19, 0.34, 0.62, stdMat(cfg.dress), 14);
    skirt.position.y = -0.2;
    torso.add(skirt);
  }
  if (cfg.uniform) {
    torso.add(box(0.4, 0.05, 0.26, stdMat(0xe8c14a), 0, 0.16, 0));   // ceinture
    torso.add(box(0.1, 0.1, 0.02, stdMat(0xe8c14a), -0.12, 0.32, -0.15)); // insigne
  }
  if (cfg.tie) {
    torso.add(box(0.07, 0.22, 0.02, stdMat(0x8b1a1a), 0, 0.26, -0.145));
  }
  g.add(torso);

  // bras
  const arms = [];
  [-0.28, 0.28].forEach((dx, i) => {
    const shoulder = new THREE.Group();
    shoulder.position.set(dx, 1.42, 0);
    const upper = capsule(0.075, 0.3, cfg.shortSleeve ? shirtM : skin, 0, -0.16, 0);
    shoulder.add(upper);
    const elbow = new THREE.Group();
    elbow.position.set(0, -0.34, 0);
    const fore = capsule(0.065, 0.28, skin, 0, -0.15, 0);
    elbow.add(fore);
    const hand = sphere(0.075, skin, 0, -0.3, 0, 8);
    elbow.add(hand);
    shoulder.add(elbow);
    g.add(shoulder);
    arms.push({ shoulder, elbow });
  });

  // cou + tête
  const neck = cyl(0.075, 0.085, 0.1, skin, 10);
  neck.position.y = 1.53;
  g.add(neck);

  const head = new THREE.Group();
  head.position.y = 1.66;
  const skull = sphere(0.155, skin, 0, 0, 0, 18);
  skull.scale.set(0.95, 1.06, 0.98);
  head.add(skull);
  // cheveux
  const hairM = stdMat(cfg.hair || 0x1a120c, { roughness: 0.95 });
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.163, 18, 14, 0, Math.PI * 2, 0, Math.PI * 0.62), hairM);
  cap.position.y = 0.012;
  head.add(cap);
  if (cfg.hairLong) {
    const back = capsule(0.1, 0.34, hairM, 0, -0.16, 0.1);
    back.scale.set(1.5, 1, 0.7);
    head.add(back);
    [-0.13, 0.13].forEach((dx) => {
      const lock = capsule(0.05, 0.3, hairM, dx, -0.12, 0.02);
      head.add(lock);
    });
  }
  // yeux
  const eyeM = stdMat(0xf6f6f6, { roughness: 0.4 });
  const pupilM = stdMat(0x1b1208, { roughness: 0.5 });
  [-0.055, 0.055].forEach((dx) => {
    const e = sphere(0.028, eyeM, dx, 0.02, -0.135, 10);
    head.add(e);
    const p = sphere(0.014, pupilM, dx, 0.02, -0.158, 8);
    head.add(p);
  });
  // nez + bouche
  head.add(box(0.028, 0.03, 0.03, skin, 0, -0.03, -0.15));
  const mouth = box(0.055, 0.012, 0.012, stdMat(0x6b2b22), 0, -0.075, -0.145);
  head.add(mouth);
  // casquette de policière
  if (cfg.cap) {
    const c = cyl(0.165, 0.175, 0.07, stdMat(cfg.cap), 14);
    c.position.y = 0.12;
    head.add(c);
    head.add(box(0.2, 0.03, 0.11, stdMat(cfg.cap), 0, 0.09, -0.15));
  }
  // casque de moto
  if (cfg.helmet) {
    const h = new THREE.Mesh(new THREE.SphereGeometry(0.185, 16, 14, 0, Math.PI * 2, 0, Math.PI * 0.75), stdMat(0x101014, { roughness: 0.35, metalness: 0.3 }));
    h.position.y = 0.02;
    head.add(h);
    const visor = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 12, 0, Math.PI * 0.9, Math.PI * 0.28, Math.PI * 0.3), stdMat(0x2a3d55, { roughness: 0.15, metalness: 0.7 }));
    visor.rotation.y = -0.35;
    visor.position.z = -0.02;
    head.add(visor);
  }
  // lunettes
  if (cfg.glasses) {
    head.add(box(0.19, 0.05, 0.02, stdMat(0x0a0a0a, { metalness: 0.5, roughness: 0.3 }), 0, 0.02, -0.15));
  }
  g.add(head);

  g.userData = { legs, arms, head, torso };
  return g;
}

function makeTovo() {
  return makeHuman({
    shirt: 0xd93b3b, pants: 0x2b4a7a, hair: 0x1a120c, skin: SKIN,
    shortSleeve: true, bareLegs: false, shoe: 0x2b2b2b,
  });
}
function makeNoro() {
  const g = makeHuman({
    shirt: 0xf2e6d2, pants: 0xb8324a, dress: 0xc8324a, hair: 0x120c08,
    hairLong: true, skin: SKIN_L, bareLegs: true, shoe: 0x8a5a3a,
  });
  return g;
}
function makePoliciere() {
  return makeHuman({
    shirt: 0x2b4c8c, pants: 0x1e3a6e, uniform: true, cap: 0x1a2a4a,
    hair: 0x120c08, skin: SKIN_L, shoe: 0x141414,
  });
}
function makePatron() {
  return makeHuman({
    shirt: 0x1b1b1f, pants: 0x14141a, tie: true, glasses: true,
    hair: 0x0f0f0f, skin: SKIN, shoe: 0x0a0a0a,
  });
}
function makeKidnapper() {
  const g = makeHuman({
    shirt: 0x22252b, pants: 0x14161a, helmet: true, hair: 0x0a0a0a,
    skin: SKIN, shoe: 0x0a0a0a,
  });
  return g;
}

// animation de marche / course
function animateHuman(obj, t, speedFactor) {
  const u = obj.userData;
  if (!u || !u.legs) return;
  const amp = Math.min(1, speedFactor) * 0.95;
  const s = Math.sin(t);
  const c = Math.cos(t);
  u.legs[0].hip.rotation.x = s * amp;
  u.legs[1].hip.rotation.x = -s * amp;
  u.legs[0].knee.rotation.x = Math.max(0, -c) * amp * 1.15;
  u.legs[1].knee.rotation.x = Math.max(0, c) * amp * 1.15;
  u.arms[0].shoulder.rotation.x = -s * amp * 0.85;
  u.arms[1].shoulder.rotation.x = s * amp * 0.85;
  u.arms[0].elbow.rotation.x = -0.35 - Math.max(0, -s) * 0.5 * amp;
  u.arms[1].elbow.rotation.x = -0.35 - Math.max(0, s) * 0.5 * amp;
  u.torso.position.y = 0.9 + Math.abs(Math.sin(t)) * 0.03 * amp;
  u.torso.rotation.x = 0.06 * amp;
  u.head.rotation.x = -0.04 * amp;
}

// ============ VÉHICULES ============
function makeTaxi() {
  const g = new THREE.Group();
  const body = texturedMat(TEX.wood, 0xf2d24a, { roughness: 0.55, metalness: 0.15 });

function makePalm() {
  const g = new THREE.Group();
  const trunkM = texturedMat(TEX.wood, 0x8a6a45, { roughness: 0.95 });
  const segs = 5;
  let y = 0;
  for (let i = 0; i < segs; i++) {
    const seg = cyl(0.19 - i * 0.02, 0.23 - i * 0.02, 1.0, trunkM, 8);
    seg.position.set(Math.sin(i * 0.5) * 0.22, y + 0.5, 0);
    seg.rotation.z = Math.sin(i * 0.5) * 0.06;
    g.add(seg);
    y += 0.95;
  }
  const topX = Math.sin((segs - 1) * 0.5) * 0.22;
  for (let i = 0; i < 7; i++) {
    const leaf = new THREE.Group();
    const blade = box(0.26, 0.06, 2.0, stdMat(0x3f7a2f, { roughness: 0.9 }), 0, 0, 1.0);
    blade.rotation.x = -0.25;
    leaf.add(blade);
    leaf.position.set(topX, y, 0);
    leaf.rotation.y = (i / 7) * Math.PI * 2;
    leaf.rotation.x = -0.15;
    g.add(leaf);
  }
  const coco = sphere(0.16, stdMat(0x5a4a2a), topX, y - 0.15, 0, 8);
  g.add(coco);
  return g;
}

function makeObstacle(type, lane, z) {
  let g;
  if (type === "dog") {
    g = new THREE.Group();
    const fur = stdMat(0xb08d5a, { roughness: 0.95 });
    const body = capsule(0.19, 0.5, fur, 0, 0.5, 0);
    body.rotation.z = Math.PI / 2;
    g.add(body);
    g.add(sphere(0.17, fur, 0.42, 0.62, 0, 10));
    g.add(box(0.16, 0.1, 0.12, stdMat(0x8a6a3a), 0.56, 0.52, 0));
    [[-0.3, 0.12], [0.3, 0.12], [-0.3, -0.12], [0.3, -0.12]].forEach(([dx, dz]) => {
      g.add(box(0.08, 0.34, 0.08, fur, dx, 0.18, dz));
    });
    g.add(box(0.06, 0.18, 0.06, fur, -0.42, 0.62, 0));
  } else if (type === "car") {
    g = new THREE.Group();
    const colors = [0xc0392b, 0x2b5fc0, 0xe8e8e8, 0x2f8f6f, 0x8a5ac9];
    const c = colors[Math.floor(Math.random() * colors.length)];
    const bodyM = stdMat(c, { roughness: 0.35, metalness: 0.45 });
    g.add(box(1.9, 0.85, 3.6, bodyM, 0, 0.75, 0));
    g.add(box(1.72, 0.7, 1.9, bodyM, 0, 1.45, -0.15));
    const glass = stdMat(0x1c2830, { roughness: 0.1, metalness: 0.6 });
    g.add(box(1.6, 0.5, 0.06, glass, 0, 1.45, -1.12));
    g.add(box(1.6, 0.5, 0.06, glass, 0, 1.45, 0.82));
    [-0.9, 0.9].forEach((dx) => {
      [-1.1, 1.1].forEach((dz) => {
        const w = cyl(0.36, 0.36, 0.22, stdMat(0x101010), 14);
        w.rotation.z = Math.PI / 2;
        w.position.set(dx, 0.36, dz);
        g.add(w);
      });
    });
    const tail = stdMat(0xff3b30, { emissive: 0xcc2018, emissiveIntensity: 1.4 });
    g.add(box(0.28, 0.14, 0.05, tail, -0.6, 0.85, 1.82));
    g.add(box(0.28, 0.14, 0.05, tail, 0.6, 0.85, 1.82));
  } else if (type === "stall") {
    g = makeStall();
    g.scale.setScalar(0.85);
  } else if (type === "buoy") {
    g = new THREE.Group();
    const b = cyl(0.38, 0.5, 0.9, stdMat(0xd94f4f, { roughness: 0.5 }), 14);
    b.position.y = 0.45;
    g.add(b);
    g.add(cyl(0.4, 0.4, 0.16, stdMat(0xf2f2f2), 14).translateY(0.62));
    g.add(sphere(0.14, stdMat(0xfff2a0, { emissive: 0xffe066, emissiveIntensity: 1.2 }), 0, 0.95, 0, 8));
  } else if (type === "bird") {
    g = new THREE.Group();
    const feather = stdMat(0x1c1c22, { roughness: 0.7 });
    g.add(box(0.5, 0.26, 0.85, feather, 0, 0, 0));
    const w1 = box(1.5, 0.05, 0.42, feather, -0.85, 0.08, 0);
    const w2 = box(1.5, 0.05, 0.42, feather, 0.85, 0.08, 0);
    g.add(w1, w2);
    g.userData.wings = [w1, w2];
  } else {
    g = new THREE.Group();
    g.add(sphere(0.5, stdMat(0x7a7a80, { roughness: 0.95 }), 0, 0.35, 0, 8));
  }
  g.position.set([-2.3, 0, 2.3][lane], type === "bird" ? 3.2 : 0, z);
  g.userData.lane = lane;
  g.userData.type = type;
  g.userData.phase = Math.random() * 6.28;
  return g;
}

// ---------- décor par environnement ----------
function populate(cfg) {
  const rand = (a, b) => a + Math.random() * (b - a);
  for (let z = -6; z > -340; z -= rand(11, 17)) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const dist = rand(6.5, 16);

    if (cfg.env === "village") {
      const r = Math.random();
      if (r < 0.4) {
        const h = makeHouse(rand(0.85, 1.15));
        h.position.set(side * dist, 0, z);
        h.rotation.y = side > 0 ? -0.35 : 0.35;
        world.add(h);
      } else if (r < 0.62) {
        const p = makePalm();
        p.position.set(side * dist, 0, z);
        p.scale.setScalar(rand(0.85, 1.2));
        world.add(p);
      } else if (r < 0.8) {
        const rz = makeRiziere();
        rz.position.set(side * (dist + 3), 0, z);
        world.add(rz);
      } else if (r < 0.92) {
        const zb = makeZebu();
        zb.position.set(side * (dist + 1), 0, z);
        zb.rotation.y = side > 0 ? -1.7 : 1.7;
        world.add(zb);
      } else {
        for (let k = 0; k < 3; k++) {
          const ch = makeChicken();
          ch.position.set(side * (dist + rand(-1, 1)), 0, z + rand(-2, 2));
          ch.rotation.y = rand(0, 6.28);
          world.add(ch);
        }
      }
    } else if (cfg.env === "road") {
      if (Math.random() < 0.75) {
        const t = makeTree(Math.random() < 0.5 ? 0 : 1);
        t.position.set(side * dist, 0, z);
        t.scale.setScalar(rand(0.8, 1.35));
        world.add(t);
      } else {
        const h = makeHouse(0.9);
        h.position.set(side * (dist + 1), 0, z);
        world.add(h);
      }
    } else if (cfg.env === "market") {
      if (Math.random() < 0.8) {
        const s = makeStall();
        s.position.set(side * dist, 0, z);
        s.rotation.y = side > 0 ? -0.5 : 0.5;
        world.add(s);
      } else {
        const p = makeHuman({ shirt: [0xd94f4f, 0x3f8fd9, 0xe8a33d][Math.floor(Math.random() * 3)], pants: 0x2b2b2b, skin: SKIN });
        p.position.set(side * dist, 0, z);
        p.rotation.y = rand(0, 6.28);
        p.scale.setScalar(0.95);
        world.add(p);
      }
    } else if (cfg.env === "sea") {
      if (Math.random() < 0.5) {
        const b = makeBoat();
        b.position.set(side * (dist + 4), 0, z);
        b.rotation.y = side > 0 ? -0.4 : 0.4;
        b.scale.setScalar(rand(0.8, 1.3));
        world.add(b);
      }
    } else {
      // ciel : nuages
      const cloud = new THREE.Group();
      for (let i = 0; i < 4; i++) {
        const s = sphere(rand(1.4, 2.6), stdMat(0xffffff, { roughness: 1 }), rand(-2.2, 2.2), rand(-0.5, 0.5), rand(-1.5, 1.5), 8);
        cloud.add(s);
      }
      cloud.position.set(side * (dist + 8), rand(2, 12), z);
      world.add(cloud);
    }
  }

  // collines lointaines
  const hillColors = cfg.env === "sea" ? [0x2a6f8a, 0x1f5f7a] : [0x4a7a3a, 0x3f6b33];
  for (let i = 0; i < 8; i++) {
    const h = makeHill(rand(26, 46), hillColors[i % 2], rand(16, 34));
    h.position.x = -140 + i * 40;
    h.position.z = -190 - rand(0, 60);
    world.add(h);
  }
}
// ============ DÉMARRAGE NIVEAU ============
function startLevel(idx) {
  G.level = idx;
  const cfg = LEVELS[idx];
  clearWorld();

  skyMat.uniforms.top.value.set(cfg.skyTop);
  skyMat.uniforms.bottom.value.set(cfg.skyBot);
  scene.fog = new THREE.Fog(cfg.fog, cfg.fogNear, cfg.fogFar);
  sun.intensity = idx === 4 ? 2.2 : 2.6;
  hemi.intensity = idx === 4 ? 0.8 : 0.95;

  world.add(buildGround(cfg));
  populate(cfg);

  if (cfg.player === "tovo") player = makeTovo();
  else if (cfg.player === "taxi") player = makeTaxi();
  else if (cfg.player === "boat") player = makeBoat();
  else player = makeHeli();
  player.position.set(0, 0, 0);
  world.add(player);

  // cible
  const kind = idx === 0 ? "noro" : (idx === 4 ? "boss" : "moto");
  targetModel = new THREE.Group();
  if (kind === "noro") {
    const n = makeNoro();
    n.rotation.y = Math.PI;
    targetModel.add(n);
    targetModel.userData.human = n;
  } else if (kind === "moto") {
    const k = makeKidnapper();
    k.rotation.y = Math.PI;
    targetModel.add(k);
    const bike = new THREE.Group();
    bike.add(cyl(0.34, 0.34, 0.14, stdMat(0x101014), 16).rotateZ(Math.PI / 2).translateX(-0.0).translateY(0.36).translateZ(0.7));
    const bike2 = new THREE.Group();
    bike2.add(box(0.4, 0.34, 1.5, stdMat(0x8b1a1a, { roughness: 0.4, metalness: 0.3 }), 0, 0.6, 0));
    bike2.add(cyl(0.34, 0.34, 0.14, stdMat(0x101014), 16).rotateZ(Math.PI / 2).translateY(0.34).translateZ(0.72));
    bike2.add(cyl(0.34, 0.34, 0.14, stdMat(0x101014), 16).rotateZ(Math.PI / 2).translateY(0.34).translateZ(-0.72));
    targetModel.add(bike2);
    targetModel.userData.human = k;
    // sac avec Noro
    const sac = new THREE.Group();
    sac.add(box(0.55, 0.7, 0.45, stdMat(0xc9b48a, { roughness: 0.95 }), 0, 0, 0));
    sac.add(sphere(0.16, stdMat(0x120c08), 0, 0.42, 0, 8));
    sac.position.set(0.55, 1.1, 0.1);
    targetModel.add(sac);
  } else {
    const h = makeHeli();
    h.scale.setScalar(1.15);
    h.position.y = 1.2;
    targetModel.add(h);
    const p = makePatron();
    p.scale.setScalar(0.75);
    p.position.set(0, 1.0, -0.2);
    targetModel.add(p);
    targetModel.userData.rotor = h.userData.rotor;
  }
  targetModel.position.set(0, 0, -46);
  world.add(targetModel);

  if (cfg.env === "village" || cfg.env === "market") {
    G.cop = makePoliciere();
    G.cop.position.set(-1.2, 0, 6.2);
    world.add(G.cop);
  }

  G.lives = Math.max(3, G.lives);
  G.dist = 0; G.speed = cfg.speed; G.lane = 1; G.laneX = 0;
  G.jump = 0; G.hurt = 0; G.obstacleTimer = 2.6; G.laneCooldown = 0;
  G.scene = "play"; G.running = true;

  document.getElementById("lvlName").textContent = cfg.name;
  document.getElementById("hint").textContent = cfg.hint;
  updateHUD();
  document.getElementById("intro").classList.add("hide");
}

function updateHUD() {
  document.getElementById("hearts").textContent =
    "❤".repeat(Math.max(0, G.lives)) + "🖤".repeat(Math.max(0, 3 - G.lives));
  document.getElementById("score").textContent = G.score.toLocaleString("fr-FR") + " Ar";
  const cfg = LEVELS[G.level];
  const rest = Math.max(0, Math.round((cfg.length - G.dist) / 10));
  document.getElementById("distTxt").textContent = rest + " m";
  document.getElementById("distFill").style.width = Math.min(100, (G.dist / cfg.length) * 100) + "%";
  document.getElementById("speed").textContent = Math.round(G.speed * 3.6) + " km/h";
}

function hurt() {
  if (G.hurt > 0) return;
  G.hurt = 1.1;
  G.lives -= 1;
  G.speed = Math.max(LEVELS[G.level].speed * 0.6, G.speed * 0.55);
  const f = document.getElementById("flash");
  f.style.opacity = 0.4;
  setTimeout(() => (f.style.opacity = 0), 110);
  updateHUD();
  if (G.lives <= 0) gameOver();
}

function gameOver() {
  G.scene = "over"; G.running = false;
  showPanel("GAME OVER", "Tovo est tombé. Ny dia mbola mitohy : réessaie, le village compte sur toi.",
    "Hamerina ▶", () => { G.lives = 3; startLevel(G.level); });
}

function levelComplete() {
  G.running = false; G.scene = "win";
  G.score += 500 * (G.level + 1);
  G.lives = Math.min(3, G.lives + 1);
  updateHUD();
  const next = G.level + 1;
  if (next < LEVELS.length) {
    const titles = ["Noro est retrouvée !", "La moto est rattrapée !", "Le Patron est localisé !", "Le bateau est bloqué !"];
    showPanel(titles[G.level] || "Niveau réussi !",
      "Étape suivante : <em>" + LEVELS[next].sub + "</em>. " + LEVELS[next].hint + ".",
      "Hanohy ▶", () => startLevel(next));
  } else {
    showPanel("Misaotra, Tovo !",
      "Tu ramènes Noro au village. Le Maire te serre dans les bras : « Tu es le héros du village. » La policière s'excuse et devient ton amie. Ny tanàna mankalaza !",
      "Jouer encore ▶", () => { G.score = 0; G.lives = 3; startLevel(0); });
  }
}

function showPanel(title, text, btn, action) {
  const ov = document.getElementById("intro");
  document.getElementById("ovTop").textContent = "Sauver la Fille du Maire 3D";
  document.getElementById("ovTitle").textContent = title;
  document.getElementById("ovText").innerHTML = text;
  document.getElementById("ovBtn").textContent = btn;
  document.getElementById("ovStep").textContent = "";
  ov.classList.remove("hide");
  document.getElementById("ovBtn").onclick = () => { ov.classList.add("hide"); action(); };
}

function showStory() {
  const s = STORY[G.storyStep];
  const ov = document.getElementById("intro");
  document.getElementById("ovTop").textContent = "Sauver la Fille du Maire 3D";
  document.getElementById("ovTitle").textContent = s.t;
  document.getElementById("ovText").innerHTML = s.x;
  document.getElementById("ovStep").textContent = (G.storyStep + 1) + " / " + STORY.length;
  document.getElementById("ovBtn").textContent =
    G.storyStep < STORY.length - 1 ? "Hanohy ▶" : "Hanomboka ny lalao ▶";
  ov.classList.remove("hide");
  document.getElementById("ovBtn").onclick = () => {
    if (G.storyStep < STORY.length - 1) { G.storyStep++; showStory(); }
    else { ov.classList.add("hide"); startLevel(0); }
  };
}

// ============ CONTRÔLES (corrigés) ============
const input = { left: false, right: false, jump: false };
function moveLane(dir) {
  if (G.scene !== "play" || G.laneCooldown > 0) return;
  const next = Math.max(0, Math.min(2, G.lane + dir));
  if (next !== G.lane) {
    G.lane = next;
    G.laneCooldown = 0.16;
  }
}
function bindHold(el, onPress, onRelease) {
  const press = (e) => {
    e.preventDefault();
    el.classList.add("on");
    onPress();
  };
  const release = (e) => {
    if (e) e.preventDefault();
    el.classList.remove("on");
    if (onRelease) onRelease();
  };
  el.addEventListener("touchstart", press, { passive: false });
  el.addEventListener("touchend", release, { passive: false });
  el.addEventListener("touchcancel", release, { passive: false });
  el.addEventListener("mousedown", press);
  el.addEventListener("mouseup", release);
  el.addEventListener("mouseleave", release);
}
bindHold(document.getElementById("left"), () => moveLane(-1));
bindHold(document.getElementById("right"), () => moveLane(1));
bindHold(document.getElementById("jump"), () => { input.jump = true; }, () => { input.jump = false; });

addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "q") moveLane(-1);
  if (e.key === "ArrowRight" || e.key === "d") moveLane(1);
  if (e.key === " " || e.key === "ArrowUp" || e.key === "w" || e.key === "z") {
    input.jump = true; e.preventDefault();
  }
});
addEventListener("keyup", (e) => {
  if (e.key === " " || e.key === "ArrowUp" || e.key === "w" || e.key === "z") input.jump = false;
});

// glissement
let tx = null;
canvas.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
canvas.addEventListener("touchmove", (e) => {
  if (tx === null) return;
  const dx = e.touches[0].clientX - tx;
  if (Math.abs(dx) > 40) { moveLane(dx > 0 ? 1 : -1); tx = e.touches[0].clientX; }
}, { passive: true });
canvas.addEventListener("touchend", () => { tx = null; });
// ============ BOUCLE ============
const clock = new THREE.Clock();
let elapsed = 0;
const dust = [];

function spawnDust(x, z) {
  if (dust.length > 40) return;
  const p = new THREE.Mesh(
    new THREE.SphereGeometry(0.09 + Math.random() * 0.08, 5, 5),
    stdMat(0xc9b48a, { transparent: true, opacity: 0.55 })
  );
  p.position.set(x + (Math.random() - 0.5) * 0.7, 0.12, z + (Math.random() - 0.5) * 0.6);
  p.userData.life = 0.7;
  world.add(p);
  dust.push(p);
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  if (G.scene === "play" && G.running) {
    const cfg = LEVELS[G.level];
    if (G.laneCooldown > 0) G.laneCooldown -= dt;

    G.speed += (cfg.speed - G.speed) * Math.min(1, dt * 1.2);
    const v = G.speed;
    G.dist += v * dt;
    G.score += Math.round(v * dt * 1.8);

    // position latérale lissée
    const targetX = LANES[G.lane];
    G.laneX += (targetX - G.laneX) * Math.min(1, dt * 10);
    if (player) {
      player.position.x = G.laneX;
      const lean = (targetX - G.laneX) * 0.18;
      player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, -lean, 0.12);
    }

    // saut
    if (input.jump && G.jump === 0) G.jump = 0.0001;
    if (G.jump > 0) {
      G.jump += dt * 3.1;
      const h = Math.sin(Math.min(G.jump, Math.PI)) * 2.0;
      if (player) player.position.y = Math.max(0, h);
      if (G.jump >= Math.PI) { G.jump = 0; if (player) player.position.y = 0; }
    }

    // animations
    if (player && player.userData.legs) animateHuman(player, elapsed * 9, 1);
    else if (player && player.userData.rotor) player.userData.rotor.rotation.y += dt * 26;
    else if (player) player.position.y = (player.position.y || 0) + Math.sin(elapsed * 6) * 0.002;

    if (targetModel && targetModel.userData.human) {
      animateHuman(targetModel.userData.human, elapsed * 8, 0.9);
    }
    if (targetModel && targetModel.userData.rotor) targetModel.userData.rotor.rotation.y += dt * 24;
    if (G.cop) animateHuman(G.cop, elapsed * 10, 1);

    // défilement du décor
    world.children.forEach((ch) => {
      if (ch === player || ch === targetModel || ch === G.cop || ch === world.children[0]) return;
      if (ch.userData.isObstacle) return;
      if (ch.userData.wave) return;
      ch.position.z += v * dt;
      if (ch.position.z > 45) ch.position.z -= 360;
    });

    // vagues
    props.forEach((w) => {
      if (w.userData.wave) {
        w.position.z += v * dt;
        if (w.position.z > 60) w.position.z -= 500;
      }
    });

    // cible
    if (targetModel) {
      const rest = Math.max(0, cfg.length - G.dist);
      targetModel.position.z = -9 - Math.min(34, rest * 0.13);
      targetModel.position.x = Math.sin(elapsed * 1.1) * 0.8;
      if (rest <= 4) levelComplete();
    }

    // policière
    if (G.cop) {
      const slow = v < cfg.speed * 0.92;
      G.cop.position.z += (slow ? 1.6 : -1.6) * dt;
      G.cop.position.z = Math.max(4.6, Math.min(7.7, G.cop.position.z));
      G.cop.position.x += (G.laneX * 0.75 - G.cop.position.x) * dt * 2.6;
      G.cop.rotation.y = Math.PI;
      if (G.cop.position.z > 7.45) hurt();
    }

    // obstacles
    G.obstacleTimer -= dt;
    if (G.obstacleTimer <= 0) {
      const lane = Math.floor(Math.random() * 3);
      const o = makeObstacle(cfg.obstacle, lane, -115 - Math.random() * 40);
      o.userData.isObstacle = true;
      world.add(o);
      obstacles.push(o);
      G.obstacleTimer = Math.max(0.62, 1.7 - G.level * 0.14) + Math.random() * 0.6;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.position.z += v * dt;
      if (o.userData.type === "bird") {
        o.position.y = 2.8 + Math.sin(elapsed * 2 + o.userData.phase) * 0.8;
        o.position.x = LANES[o.userData.lane] + Math.sin(elapsed * 1.5 + o.userData.phase) * 0.4;
        if (o.userData.wings) {
          const flap = Math.sin(elapsed * 14 + o.userData.phase) * 0.5;
          o.userData.wings[0].rotation.z = flap;
          o.userData.wings[1].rotation.z = -flap;
        }
      }
      if (o.position.z > 15) {
        world.remove(o);
        obstacles.splice(i, 1);
        continue;
      }
      const dz = Math.abs(o.position.z);
      const dx = Math.abs(o.position.x - G.laneX);
      const py = player ? player.position.y : 0;
      if (dz < 1.6 && dx < 1.2) {
        const isAir = o.userData.type === "bird";
        const collide = isAir ? (py > 1.3 && py < 4.8) : (py < 1.35);
        if (collide) {
          hurt();
          world.remove(o);
          obstacles.splice(i, 1);
        }
      }
    }

    // poussière
    if (player && cfg.player === "tovo" && Math.random() < dt * 14) {
      spawnDust(G.laneX, 0.4);
    }
    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i];
      p.userData.life -= dt;
      p.position.z += v * dt * 0.8;
      p.position.y += dt * 0.4;
      p.scale.multiplyScalar(1 + dt * 1.6);
      p.material.opacity = Math.max(0, p.userData.life * 0.6);
      if (p.userData.life <= 0) { world.remove(p); dust.splice(i, 1); }
    }

    if (G.hurt > 0) G.hurt -= dt;
    updateHUD();
  }

  // caméra : suit la voie, léger retard et tremblement
  if (player) {
    const shakeX = G.hurt > 0 ? (Math.random() - 0.5) * 0.25 : 0;
    camera.position.x += (player.position.x * 0.6 + shakeX - camera.position.x) * 0.09;
    camera.position.y += (4.5 + (player.position.y || 0) * 0.35 - camera.position.y) * 0.07;
    camera.position.z = 9.2;
    camera.lookAt(player.position.x * 0.45, 1.55 + (player.position.y || 0) * 0.25, -14);
    const targetFov = 64 + Math.min(10, G.speed * 0.25);
    camera.fov += (targetFov - camera.fov) * 0.04;
    camera.updateProjectionMatrix();
  }
  sky.position.copy(camera.position);

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

// ============ LANCEMENT ============
clearWorld();
player = makeTovo();
player.position.set(0, 0, 0);
world.add(player);
scene.fog = new THREE.Fog(0xbcd9e6, 45, 190);
document.getElementById("loading").style.display = "none";
showStory();
tick();

if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

</script>
